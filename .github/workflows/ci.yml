name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The offline job installs nothing but pytest. Every number in README.md's
  # grid is produced by code that imports only the standard library. If
  # the measurement ever starts needing the SDK, this job goes red, which is
  # the signal that the claim "the grid runs anywhere" has stopped being true.
  # The protocol tests skip here, with reasons.
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Pinned to current majors (verified against the CI-green sibling repos):
      # checkout v7, setup-python v7.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      # -rs prints the skip reasons, so a green run here shows WHICH tests
      # skipped and why rather than looking like full coverage.
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q -rs

      # The gate checks the numbers in the prose, not behavior. A refactor that
      # keeps every test green while moving wire/semantic from 7/8 to 6/8 has
      # made the README wrong, and that is a different failure from a bug.
      - name: Pinning gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pin.gate

      - name: Demo (offline leg only)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py --matrix

      # SAMPLE_RUN.md quotes the gate's output verbatim. This step is what
      # makes "verbatim" a claim that can fail: the quoted block is diffed
      # against a fresh run. The protocol job below does the same for all
      # three legs.
      - name: SAMPLE_RUN.md gate capture is current
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_sample_run.py --offline

  # Separate job because it launches subprocesses and speaks a protocol.
  # Legs 2 and 3 start real MCP servers over stdio, so an SDK release that
  # breaks an import fails HERE, under the name "protocol", while the offline
  # measurement above stays green: the two are different failures with
  # different fixes, and the split keeps them tellable apart. Both jobs gate
  # the badge. README.md promises that an SDK change fails a test rather than
  # silently invalidating a claim, and a job whose failure the badge ignored
  # would not keep that promise.
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install with the SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Protocol tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_integration.py tests/test_exposure_and_shadow.py -v -rs

      - name: Full demo (all three legs)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_demo.py

      - name: SAMPLE_RUN.md capture is current (gate and all three legs)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_sample_run.py
